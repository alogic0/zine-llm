name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-tests:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable automatic line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Zig
        uses: mlugg/setup-zig@v2

      - name: Verify Zig version
        run: zig version

      - name: Run native tests
        run: zig build test -Dno-git-version

      - name: Exercise the macOS live-reload watcher
        if: runner.os == 'macOS'
        run: zig build test-workflows -Dno-git-version

  release-targets:
    name: Compile release targets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Zig
        uses: mlugg/setup-zig@v2

      - name: Compile all supported release targets
        run: zig build check-release-targets -Dpreview=true -Dno-git-version

      - name: Verify archive-tool isolation
        run: zig build test-release-tool-isolation -Dno-git-version

  release-archives:
    name: Build and verify release archives
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Zig
        uses: mlugg/setup-zig@v2

      - name: Build and verify tagged release archives
        if: startsWith(github.ref, 'refs/tags/v')
        run: zig build verify-release -Dpreview=true

      - name: Build and verify preview release archives
        if: github.event_name == 'workflow_dispatch'
        run: zig build verify-release -Dpreview=true -Dno-git-version
